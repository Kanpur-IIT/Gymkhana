<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>404 - Page Not Found | Students' Gymkhana – IIT Kanpur</title>
    <link rel="icon" type="image/png" href="assets/images/wuj.jpg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a1a; color: #ffffff; overflow-x: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        a { text-decoration: none; color: inherit; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; width: 100%; }

        /* Glowing Effect */
        .glow-text { background: linear-gradient(135deg, #ffffff 20%, #ffd700 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 50px rgba(255, 215, 0, 0.2); }
        .error-code { font-size: 8rem; font-weight: 900; line-height: 1; background: linear-gradient(180deg, #ffd700, #ff8c00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 30px rgba(255,215,0,0.3)); animation: float 4s ease-in-out infinite; }

        .btn-glow { display: inline-block; padding: 14px 44px; border-radius: 60px; background: linear-gradient(135deg, #ffd700, #f0a500); color: #0a0a1a; font-weight: 700; font-size: 1.05rem; box-shadow: 0 0 40px rgba(255, 215, 0, 0.2); transition: 0.3s ease; }
        .btn-glow:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(255, 215, 0, 0.4); }

        .navbar { background: rgba(10, 10, 26, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 215, 0, 0.15); padding: 14px 0; }
        .navbar .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.2rem; color: #fff; }
        .navbar .logo img { height: 44px; border-radius: 10px; filter: drop-shadow(0 0 12px rgba(255,215,0,0.3)); }

        .footer { background: rgba(5, 5, 18, 0.95); backdrop-filter: blur(8px); border-top: 1px solid rgba(255, 215, 0, 0.08); padding: 24px 0; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @media (max-width: 480px) { .error-code { font-size: 5.5rem; } }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container flex justify-between items-center">
            <a href="index.html" class="logo">
                <img src="assets/images/wuj.jpg" alt="Logo" onerror="this.style.display='none'">
                <span>Students' Gymkhana</span>
            </a>
            <div class="text-sm text-gray-400">IIT Kanpur</div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center text-center px-4 my-12" style="background: radial-gradient(circle at center, rgba(255,215,0,0.03), transparent 70%);">
        <div class="max-w-xl w-full">
            <div class="error-code">404</div>
            <h1 class="text-3xl md:text-4xl font-extrabold mt-4 mb-3 glow-text">Lost in Space?</h1>
            <p class="text-gray-400 text-base md:text-lg mb-8 leading-relaxed">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back on track!
            </p>
            <a href="index.html" class="btn-glow">
                <i class="fa-solid fa-house mr-2"></i> Go Back Home
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer text-center">
        <div class="container">
            <p class="text-gray-600 text-xs">&copy; Students' Gymkhana, IIT Kanpur. All rights reserved.</p>
        </div>
    </footer>

<!-- ═══════════════ GYMKHANA CMS (VISITOR ONLY) ═══════════════ -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function(){
'use strict';
var CFG = {
apiKey: "AIzaSyDdr1WNCA-DPYo5N1Ea0uH_hA9PfkRYyX8",
authDomain: "gymkhanaiitk.firebaseapp.com",
databaseURL: "https://gymkhanaiitk-default-rtdb.firebaseio.com",
projectId: "gymkhanaiitk",
storageBucket: "gymkhanaiitk.firebasestorage.app",
messagingSenderId: "389270259342",
appId: "1:389270259342:web:65e918f934c8cc83b6ebdf"
};
function ready(cb,t){t=t||0;if(typeof firebase!=='undefined'&&firebase.apps)return cb();if(t<50)setTimeout(function(){ready(cb,t+1)},100);}
ready(function(){
if(!firebase.apps.length)firebase.initializeApp(CFG);
var db=firebase.firestore();
var path=window.location.pathname;

// 1. THEME
db.collection('settings').doc('activeTheme').get().then(function(doc){
if(!doc.exists)return;
var d=doc.data();
if(!d.css||!d.css.trim())return;
var s=document.createElement('style');
s.id='cms-theme';
s.textContent=d.css;
document.head.appendChild(s);
}).catch(function(){});

// 2. TAG ELEMENTS
var tags=['h1','h2','h3','h4','h5','h6','p','span','a','li'];
tags.forEach(function(tag){
document.querySelectorAll(tag).forEach(function(el,idx){
if(el.closest('nav')||el.closest('footer'))return;
if(el.closest('script')||el.closest('style'))return;
el.dataset.cmsId=tag+'_'+idx;
});
});
document.querySelectorAll('img').forEach(function(img,idx){
if(img.closest('nav')||img.closest('footer'))return;
img.dataset.cmsId='img_'+idx;
});
document.querySelectorAll('section,.content-section,.card-glass').forEach(function(s,idx){
if(s.closest('nav')||s.closest('footer'))return;
s.dataset.cmsSection=idx;
});

// 3. LOAD CONTENT
db.collection('pages').doc(encodeURIComponent(path)).get().then(function(doc){
if(!doc.exists)return;
var data=doc.data();
if(data.elements){
data.elements.forEach(function(item){
var el=document.querySelector('[data-cms-id="'+item.id+'"]');
if(!el)return;
if(item.type==='text')el.innerHTML=item.value;
else if(item.type==='image')el.src=item.value;
});
}
if(data.addedSections){
data.addedSections.forEach(function(sec){
var w=document.createElement('div');
w.innerHTML=sec.html;
document.body.appendChild(w);
});
}
if(data.deletedSections){
data.deletedSections.forEach(function(idx){
var s=document.querySelector('[data-cms-section="'+idx+'"]');
if(s)s.style.display='none';
});
}
}).catch(function(){});

// 4. POPUP
function match(p){
if(p.targetType==='all')return true;
if(p.targetType==='specific'&&p.targetPages)return p.targetPages.indexOf(path)>-1;
if(p.targetType==='pattern'&&p.urlPattern){
var pat=p.urlPattern.replace(/\*/g,'.*');
return new RegExp('^'+pat+'$').test(path);
}
return false;
}
function active(p){
var n=new Date();
var today=n.toISOString().split('T')[0];
var ct=n.toTimeString().slice(0,5);
if(p.status!=='active')return false;
if(p.startDate&&p.startDate>today)return false;
if(p.startTime&&p.startDate===today&&p.startTime>ct)return false;
if(p.endDate&&p.endDate<today)return false;
if(p.endTime&&p.endDate===today&&p.endTime<ct)return false;
return true;
}
function esc(s){if(!s)return '';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

db.collection('popups').where('status','==','active').get().then(function(snap){
var best=null;
snap.forEach(function(doc){
var p=doc.data();p.id=doc.id;
if(match(p)&&active(p)){if(!best||p.priority==='urgent')best=p;}
});
if(best&&!sessionStorage.getItem('cms_popup_'+best.id)){
setTimeout(function(){
if(document.getElementById('cmsPopup'))return;
var type=best.type||'event';
var badges={info:'ℹ️ Info',event:'🎉 Event',warning:'⚠️ Warning',urgent:'🚨 Urgent',success:'✅ Success'};
var ov=document.createElement('div');
ov.id='cmsPopup';
ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:Segoe UI,sans-serif;';
var h='<div style="background:rgba(18,28,50,0.98);border:1px solid rgba(255,215,0,0.3);border-radius:24px;padding:32px;max-width:500px;width:90%;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.8);color:#fff;">';
h+='<button onclick="document.getElementById(\'cmsPopup\').remove()" style="position:absolute;top:12px;right:16px;background:rgba(255,255,255,0.05);border:none;color:#b0bcc8;font-size:1.4rem;cursor:pointer;border-radius:50%;width:36px;height:36px;">✕</button>';
h+='<span style="display:inline-block;padding:4px 14px;border-radius:20px;font-size:0.7rem;font-weight:600;text-transform:uppercase;margin-bottom:12px;background:rgba(255,215,0,0.15);color:#ffd700;">'+(badges[type]||'📢')+'</span>';
if(best.image)h+='<img src="'+best.image+'" style="width:100%;border-radius:12px;margin-bottom:16px;max-height:200px;object-fit:cover;">';
h+='<h2 style="font-size:1.5rem;font-weight:700;margin-bottom:8px;color:#fff;">'+esc(best.title)+'</h2>';
if(best.code&&best.code.trim()){h+='<div>'+best.code+'</div>';}
else{h+='<div style="color:#b0bcc8;line-height:1.6;font-size:0.95rem;margin:12px 0 16px;">'+esc(best.message)+'</div>';}
if(best.link){h+='<a href="'+best.link+'" target="_blank" style="display:inline-block;padding:10px 28px;border-radius:40px;background:linear-gradient(135deg,#ffd700,#f0a500);color:#0a0a1a;font-weight:700;text-decoration:none;font-size:0.9rem;">'+esc(best.btnText||'Learn More')+'</a>';}
h+='</div>';
ov.innerHTML=h;
document.body.appendChild(ov);
},500);
sessionStorage.setItem('cms_popup_'+best.id,'shown');
}
}).catch(function(){});
});
})();
</script>
<!-- ═══════════════ END GYMKHANA CMS ═══════════════ -->
</body>
</html>
